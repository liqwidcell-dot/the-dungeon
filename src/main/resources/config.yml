# The Dungeon — configuration
#
# Everything here is read at startup. After editing, restart the server (or
# /reload) for changes to take effect.
#
# These are the numbers you will be tuning while you playtest. Nothing below
# requires recompiling the plugin.

arena:
  # The world the box is built in. Must already exist.
  world: world

  # Fixed position. Changing these moves the arena on next start.
  x: 0
  y: 120
  z: 0

  # Interior half-extent. radius 12 gives a 25x25 floor.
  radius: 12

  # How many blocks above the floor the walls go. +1 is added for the roof.
  wall-height: 6

  # The box is sealed stone, so with no lamps in it you cannot see a thing.
  # A grid of these is set into the floor and the ceiling when the arena is
  # built, and topped up on every start.
  #
  # Any block works; the obvious ones are SEA_LANTERN, GLOWSTONE, SHROOMLIGHT,
  # OCHRE_FROGLIGHT and REDSTONE_LAMP.
  light-block: SEA_LANTERN

  # Blocks between lamps. 5 on a radius-12 arena gives a 5x5 grid of them.
  # Lower is brighter and busier; 2 is the smallest that still reads as a grid.
  light-spacing: 5

run:
  # How many normal waves before the boss arrives.
  waves: 10

  # Ticks between "is the wave clear yet" checks. 20 ticks = 1 second.
  # Lower is more responsive but costs more per second.
  poll-ticks: 10

  # Seconds of rest between waves. Health is refilled and the prize chest is
  # restocked for you to open.
  breather-seconds: 5

  # The prize chest. Clearing a wave drops a chest in the middle of the arena,
  # holding random loot drawn from that wave's tier, and it is restocked every
  # wave — so the loot gets better the further you get.
  #
  #   items = chest-items-base + floor(chest-items-per-wave * wave)
  #   wave 1  -> 2 items
  #   wave 5  -> 4 items
  #   wave 10 -> 7 items
  chest-items-base: 2
  chest-items-per-wave: 0.5

  # Items granted per mob killed.
  loot-per-kill: 1

difficulty:
  # health = base-health * (1 + health-coefficient * wave ^ health-exponent)
  #
  # With the values below (read straight off the formula, not estimated):
  #   wave 1  -> 7.8 hp     (trivially easy, you should be learning the controls)
  #   wave 5  -> 21.8 hp
  #   wave 10 -> 46.3 hp
  #
  # If you change the three numbers here, redo these three lines — they are the
  # numbers the curve actually produces, and stale ones are worse than none.
  #
  # Raise health-exponent to make the late waves nastier, or lower
  # health-coefficient to flatten the whole curve.
  base-health: 6.0
  health-coefficient: 0.30
  health-exponent: 1.35

  # Mobs per wave = base-count + floor(count-per-wave * wave)
  #   wave 1 -> 3 mobs, wave 10 -> 12 mobs
  base-count: 3
  count-per-wave: 0.9

  # damage = base-damage + damage-per-wave * wave
  base-damage: 2.0
  damage-per-wave: 0.6
